name: Tourism Model Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pipeline dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Validate and register source data
        run: python tourism_project/model_building/data_register.py
      - name: Upload registered source data
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pipeline dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Create reproducible train/test splits
        run: python tourism_project/model_building/prep.py
      - name: Upload train/test split artifact
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: tourism_project/model_building/artifacts/

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pipeline dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Download train/test split artifact
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: tourism_project/model_building/artifacts/
      - name: Train, track, and evaluate model
        run: python tourism_project/model_building/train.py
      - name: Commit updated deployment model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/model.joblib tourism_project/deployment/metrics.json
          git commit -m "Update trained model [skip ci]" || echo "No model changes to commit"
          git push
